physics_settings:
  time_steps_per_second: 60
  solver_position_iterations: 8
  solver_velocity_iterations: 2
  enable_vehicle_context: true

graphics_settings:
  render_resolution: [2560, 1440]
  enable_DLSS_FPS_Multiplier_x2: false
  disable_shadows: false
  disable_ambient_occlusion: true
  disable_reflections: true

user_interface:
  viewport_mode: true
  split_screen: false

# Keep the first collision/drop test focused. At 0.05 m the full 430 x 260 m
# ROI would allocate a very large grid; enable only after choosing a map-server
# ROI or resolution explicitly.
map_server:
  enabled: false
  resolution: 0.05

network_setup:
  ros2_domain_id: 0
  network_interface: "lo"
  ros2_cmd_timeout_s: 3.0
  # Isaac Sim 6.0's bundled Humble context is stable with Fast DDS in this image.
  rmw_implementation: "rmw_fastrtps_cpp"
  # Common safety boundary for /ego/drive and /ego/control target speeds.
  ros2_max_speed_m_s: 16.6666666667  # 60 km/h

control_settings:
  ros2_command_mode: "speed"
  # Hold the free-rolling kart on the sloped spawn road whenever target speed is zero.
  stationary_hold_brake: 1.0
  stationary_hold_speed_epsilon_m_s: 0.01

environment:
  asset: "assets/maps/gnu_campus_stage_D_full_usd/usd/gnu_campus_drivable.usda"
  scale: [1.0, 1.0, 1.0]
  rotation_euler: [0.0, 0.0, 0.0]
  translation: [0.0, 0.0, 0.0]
  frictions:
    - name: "TirePhysicsMaterial"
      dynamic_friction: 1.0
      static_friction: 1.0
    - name: "AsphaltPhysicsMaterial"
      dynamic_friction: 0.7
      static_friction: 0.9
    - name: "GrassPhysicsMaterial"
      dynamic_friction: 0.4
      static_friction: 0.6
    - name: "BuildingPhysicsMaterial"
      dynamic_friction: 0.6
      static_friction: 0.7

vehicles:
  - name: "Ego_Vehicle"
    enabled: true
    asset: "assets/vehicles/kar_gokart_isaac_physx.usd"
    topic_prefix: "/ego"
    # Root XY remains at the accepted initial pose. The authored base_link is
    # offset from that root and its corrected collision surface is Z=-0.95 m;
    # +0.15 m provides a small, observable drop for contact validation.
    spawn_position: [26.242, -3.138, -0.800]
    spawn_orientation: [0.0, 0.0, -8.0]
    enable_camera: true
    enable_lidar: true
    enable_gnss: true

  - name: "Opponent_Vehicle"
    enabled: false
    asset: "assets/vehicles/kar_gokart_isaac_physx.usd"
    topic_prefix: "/opponent"
    spawn_position: [24.242, -3.138, -1.900]
    spawn_orientation: [0.0, 0.0, -8.0]
    enable_camera: true
    enable_lidar: true
    enable_gnss: true

topics_to_remap:
  - "/drive"
  - "/imu"
  - "/odom"
  - "/point_cloud"
  - "/camera/left"
  - "/camera/depth"
  - "/camera/right"
  - "/camera/left/camera_info"
  - "/camera/depth/camera_info"
  - "/camera/right/camera_info"

# Temporary validation clamp. Restore the established 6 m/s limit only after
# static contact and low-speed road/seam tests pass.
keyboard_control_settings:
  max_speed_m_s: 2.0
  max_steer_rad: 0.4
  acceleration_m_s2: 2.0
  deceleration_m_s2: 4.0
  steering_speed_rad_s: 3.0

follow_camera:
  distance: 4.5
  height: 1.5
  focus_height: 0.8

gnss:
  enabled: true
  publish_rate_hz: 10
  # GNU Gajwa mapping origin. Sim X=East, Y=North.
  map_origin:
    latitude: 35.1557292326198
    longitude: 128.09376804318663
    altitude: 68.9136798632527
  noise:
    horizontal_stddev_m: 0.5
    altitude_stddev_m: 1.0

# Keep the first integrated GUI gate focused on vehicle, sensors and ROS2.
# Dataset capture can be enabled after the map/vehicle integration is accepted.
semantic_segmentation: {}
